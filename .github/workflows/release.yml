name: Release

# Pushing a tag like v1.1.0 (or v1.1.0-rc1 for a test) builds the AppImage and puts it, with its
# checksum, on a DRAFT release: nothing is public until you press "Publish release" on GitHub.
# "Run workflow" on the Actions tab builds it too, without a release (download it from the run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04          # older libraries than 24.04 = the AppImage runs on more distros
    steps:
      - uses: actions/checkout@v5

      - name: Libraries and tools the build needs
        run: |
          sudo apt-get update -q
          # copied into the AppImage:
          sudo apt-get install -y -q libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-util1 libxkbcommon-x11-0
          # builds the memory gauge's helper (a tiny Windows program):
          sudo apt-get install -y -q gcc-mingw-w64-i686
          # what any Linux desktop has (the build checks every bundled library finds these):
          sudo apt-get install -y -q libegl1 libgl1 libopengl0 libglx0 libfontconfig1 libfreetype6 \
            libdbus-1-3 libglib2.0-0 libxkbcommon0 libx11-xcb1 libxrender1 libxi6 libsm6 libice6 \
            libxcb-randr0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxcb-shm0 libxcb-glx0 \
            libxcb-xinerama0 libxcb-xinput0 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libwayland-server0 libgbm1 libdrm2 libgtk-3-0 libcups2 libssl3 libgssapi-krb5-2

      - name: Version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$(git rev-parse --short HEAD)"; fi
          app="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' folm_core/version.py)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${v%%-*}" != "$app" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $app in folm_core/version.py"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        run: packaging/build-appimage.sh "${{ steps.v.outputs.version }}"

      - name: The AppImage starts
        run: |
          A="dist/FOLM-${{ steps.v.outputs.version }}-x86_64.AppImage"
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 "$A" --self-test
          APPIMAGE_EXTRACT_AND_RUN=1 "$A" --cli --help > /dev/null

      - name: Keep the build (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: FOLM-${{ steps.v.outputs.version }}-AppImage
          path: dist/*

      - name: Release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        run: |
          v="${{ steps.v.outputs.version }}"
          awk -v h="## ${v%%-*}" '$0 == h {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no '## ${v%%-*}' section"; exit 1; }
          printf '\n**Check the download:** `sha256sum -c FOLM-%s-x86_64.AppImage.sha256`\n' "$v" >> notes.md

      - name: Draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: FOLM ${{ steps.v.outputs.version }}
          files: dist/*
          body_path: notes.md
